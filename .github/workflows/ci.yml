name: Offline validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install the packaged CLI and test tools
        run: python -m pip install '.[dev]'
      - name: Python lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/pr2-vm/*.sh
      - name: Validate example and fixture profiles using the installed CLI
        run: bash scripts/validate-examples.sh
      - name: Smoke-test the wheel outside the checkout
        shell: bash
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/wheel-smoke.XXXXXX")"
          python -m pip wheel --no-deps --wheel-dir "$work" .
          cp config/event.example.yaml "$work/profile.yaml"
          cd "$work"
          unset PYTHONPATH
          python -m venv venv
          venv/bin/python -m pip install ./ipsecvpn-*.whl
          venv/bin/ipsecvpn validate -c profile.yaml
          venv/bin/ipsecvpn plan -c profile.yaml > plan.json
          venv/bin/ipsecvpn render -c profile.yaml --json > render.json
          venv/bin/ipsecvpn status --json > status.json
          venv/bin/ipsecvpn doctor --json > doctor.json
          site_id="$(venv/bin/python -c 'import yaml; print(yaml.safe_load(open("profile.yaml"))["sites"][0]["id"])')"
          venv/bin/ipsecvpn export-peer -c profile.yaml --site "$site_id" --format json > handoff.json
          venv/bin/python -c 'import json; assert json.load(open("handoff.json"))["status"] == "PASS"'
          venv/bin/python -c 'import json; assert len(json.load(open("render.json"))["manifest"]["links"]) == 2'
          venv/bin/python -c 'import json; assert all(json.load(open(name))["data_path"]["status"] == "SKIP" for name in ("status.json", "doctor.json"))'
      - name: Scan reachable commits for secrets
        shell: bash
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf -- "$scan_dir"' EXIT
          archive=gitleaks_8.24.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/$archive" \
            --output "$scan_dir/$archive"
          (
            cd "$scan_dir"
            printf '%s  %s\n' \
              fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e "$archive" \
              | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          )
          "$scan_dir/gitleaks" git --redact=100 --no-banner --log-opts=HEAD .
